<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="698.6967" height="508.00601" viewBox="0,0,698.6967,508.00601"><g transform="translate(29.34835,74.00301)"><g data-paper-data="{&quot;isPaintingLayer&quot;:true}" fill-rule="nonzero" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" style="mix-blend-mode: normal"><path d="M-28.34835,433.003v-506.00601h696.6967v506.00601z" fill="#000000" stroke="#000000" stroke-width="2"></path><text transform="translate(83.31567,45.06028) scale(0.46783,0.46783)" font-size="40" xml:space="preserve" fill="#ffffff" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Sans Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">So what's the characters split thing?</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">Basically instead of merging too many costumes into</tspan><tspan x="0" dy="46.150000000000006px">one sprite, which can be laggy, now you can split</tspan><tspan x="0" dy="46.150000000000006px">the characters into multiple character splits to </tspan><tspan x="0" dy="46.150000000000006px">reduce lag.</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">Notice that you can only split different characters,</tspan><tspan x="0" dy="46.150000000000006px">which means that you cannot split the costumes of</tspan><tspan x="0" dy="46.150000000000006px">a single character into multiple splits, or else the </tspan><tspan x="0" dy="46.150000000000006px">engine will break.</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">ALSO add your costumes down here, DO NOT delete</tspan><tspan x="0" dy="46.150000000000006px">this or any of the costumes above.</tspan></text></g></g></svg>