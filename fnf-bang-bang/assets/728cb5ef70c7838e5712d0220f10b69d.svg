<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="698.6967" height="508.00601" viewBox="0,0,698.6967,508.00601"><g transform="translate(29.34835,74.00301)"><g data-paper-data="{&quot;isPaintingLayer&quot;:true}" fill-rule="nonzero" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" style="mix-blend-mode: normal"><path d="M-28.34835,433.003v-506.00601h696.6967v506.00601z" fill="#000000" stroke="#000000" stroke-width="2"></path><text transform="translate(81.89758,21.22885) scale(0.46783,0.46783)" font-size="40" xml:space="preserve" fill="#ffffff" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Sans Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">You only have to add the customs then </tspan><tspan x="0" dy="46.150000000000006px">rename them and your character is ready!</tspan><tspan x="0" dy="46.150000000000006px">How to add a character?</tspan><tspan x="0" dy="46.150000000000006px">First, get the images of the character then</tspan><tspan x="0" dy="46.150000000000006px">import them here.</tspan><tspan x="0" dy="46.150000000000006px">Then rename the costumes like this :</tspan><tspan x="0" dy="46.150000000000006px">character_name animation number_for_Animation</tspan><tspan x="0" dy="46.150000000000006px">(white spaces in between)</tspan><tspan x="0" dy="46.150000000000006px">The default animation names that are automatically</tspan><tspan x="0" dy="46.150000000000006px">used by the engine are (commas aren't included): </tspan><tspan x="0" dy="46.150000000000006px">idle, left, right, up, down, MD, MU, ML, MR, loop1, loop2</tspan><tspan x="0" dy="46.150000000000006px">Example :</tspan><tspan x="0" dy="46.150000000000006px"> bf left 2</tspan><tspan x="0" dy="46.150000000000006px"> gf loop1 5</tspan><tspan x="0" dy="46.150000000000006px">what is number_for_Animation?</tspan><tspan x="0" dy="46.150000000000006px">It is the order of frame for each animation</tspan><tspan x="0" dy="46.150000000000006px"> </tspan></text></g></g></svg>