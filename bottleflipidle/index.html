<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="thumb.png">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Bottle Flip Idle</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  #unity-canvas { width: 100%; height: 100%; display: block; background: #000; }
  #loading { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 300px; height: 10px; background: #333; border-radius: 5px; overflow: hidden; }
  #bar { width: 0; height: 100%; background: #4caf50; }
</style>
</head>
<body>
<canvas id="unity-canvas" tabindex="-1"></canvas>
<div id="loading"><div id="bar"></div></div>
<script src="crazygames-sdk-stub.js"></script>
<script>
  var s = document.createElement("script");
  s.src = "Build/Build.loader.js";
  s.onload = function () {
    createUnityInstance(document.getElementById("unity-canvas"), {
      dataUrl: "Build/Build.data",
      frameworkUrl: "Build/Build.framework.js",
      codeUrl: "Build/Build.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Igru",
      productName: "Bottle Flip Idle",
      productVersion: "1.0"
    }, function (p) { document.getElementById("bar").style.width = (100 * p) + "%"; })
    .then(function (u) { window.unityInstance = u; document.getElementById("loading").style.display = "none"; })
    .catch(function (m) { alert(m); });
  };
  document.body.appendChild(s);
</script>
</body>
</html>
