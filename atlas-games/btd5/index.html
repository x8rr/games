<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="connect-src 'self' data: blob:; img-src 'self' data: blob:; media-src 'self' data: blob:">
  <title id="title">Bloons Tower Defense 5</title>
  <style>html,body{margin:0;height:100%;background:#000;overflow:hidden}#game{width:100%;height:100%}</style>
</head>
<body>
  <div id="game"></div>
  <script>window.RufflePlayer={config:{publicPath:"../../html/ruffle/",autoplay:"on",unmuteOverlay:"hidden",letterbox:"on",splashScreen:false,showSwfDownload:false,contextMenu:"on",openUrlMode:"deny",allowNetworking:"none"}};</script>
  <script src="../../html/ruffle/ruffle.js"></script>
  <script>
    const player = window.RufflePlayer.newest().createPlayer();
    player.style.width = "100%";
    player.style.height = "100%";
    document.getElementById("game").appendChild(player);
    player.load("btd5.swf");
  </script>
</body>
</html>
